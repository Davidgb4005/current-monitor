<!DOCTYPE html>
<html>
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alternator</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <p>Alternator</p>
        </header>
        <table>
            <tr>
                <td>
                    <p>Max Voltage</p>
                </td>
                <td>
                    <p id="voltageMax" class="display">0.00</p>
                </td>
            </tr>
              <tr>
                <td>
                    <p>Voltage</p>
                </td>
                <td>
                    <p id="voltage" class="display">0.00</p>
                </td>
            </tr>           
            <tr>
                <td>
                    <p>Max Current</p>
                </td>
                <td>
                    <p id="currentMax" class="display">0.00</p>
                </td>
            </tr>           
            <tr>
                <td>
                    <p>Current</p>
                </td>
                <td>
                    <p id="current" class="display">0.00</p>
                </td>
            </tr>
        </table>
        <script src="script.js"></script>
    </body>
</html>
